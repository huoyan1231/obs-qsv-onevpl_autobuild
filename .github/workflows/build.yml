name: Build obs-qsv-onevpl

on:
  push:
    branches: [main, master, NEW]
    tags: ['v*']
  pull_request:
    branches: [main, master, NEW]
  workflow_dispatch:

env:
  PLUGIN_NAME: obs-qsv-onevpl
  DEPS_VERSION: 2025-08-23

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup oneVPL
        run: |
          git clone https://github.com/oneapi-src/oneVPL.git libvpl
        working-directory: ${{ github.workspace }}/plugin

      - name: Download Prebuilt obs-deps
        run: |
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-deps/releases/download/${{ env.DEPS_VERSION }}/windows-deps-${{ env.DEPS_VERSION }}-x64.zip" -OutFile deps.zip
          7z x deps.zip -o"${{ github.workspace }}/deps" -y | Out-Null
          Remove-Item deps.zip

      - name: Download Prebuilt Qt6
        run: |
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-deps/releases/download/${{ env.DEPS_VERSION }}/windows-deps-qt6-${{ env.DEPS_VERSION }}-x64.zip" -OutFile qt6.zip
          7z x qt6.zip -o"${{ github.workspace }}/deps" -y | Out-Null
          Remove-Item qt6.zip

      - name: Configure CMake
        run: |
          cmake -S plugin -B build_x64 `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps/obs-deps-${{ env.DEPS_VERSION }}-x64;${{ github.workspace }}/deps/obs-deps-qt6-${{ env.DEPS_VERSION }}-x64" `
            -DENABLE_HEVC=ON

      - name: Build
        run: |
          cmake --build build_x64 --config RelWithDebInfo

      - name: Package Plugin
        run: |
          $PackageDir = "${{ github.workspace }}/package"
          New-Item -ItemType Directory -Path "$PackageDir/obs-plugins/64bit" -Force
          New-Item -ItemType Directory -Path "$PackageDir/data/obs-plugins/${{ env.PLUGIN_NAME }}" -Force
          Copy-Item "build_x64/obs-qsvonevpl/RelWithDebInfo/obs-qsvonevpl.dll" "$PackageDir/obs-plugins/64bit/" -ErrorAction SilentlyContinue
          Copy-Item "build_x64/obs-qsvonevpl/RelWithDebInfo/obs-qsvonevpl.pdb" "$PackageDir/obs-plugins/64bit/" -ErrorAction SilentlyContinue
          if (Test-Path "plugin/data/locale") {
            Copy-Item "plugin/data/locale/*" "$PackageDir/data/obs-plugins/${{ env.PLUGIN_NAME }}/" -Recurse
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ github.sha }}-windows-x64
          path: ${{ github.workspace }}/package/*

  linux:
    name: Ubuntu (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Install Dependencies
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y \
            obs-studio \
            libobs-dev \
            libvpl-dev \
            cmake \
            ninja-build \
            pkg-config \
            build-essential \
            libva-dev \
            libwayland-dev \
            libdrm-dev

      - name: Configure CMake
        run: |
          cmake -S plugin -B build_x64 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_HEVC=ON

      - name: Build
        run: cmake --build build_x64

      - name: Package Plugin
        run: |
          mkdir -p package/obs-plugins/64bit
          mkdir -p package/data/obs-plugins/${{ env.PLUGIN_NAME }}
          cp build_x64/obs-qsvonevpl/obs-qsvonevpl.so package/obs-plugins/64bit/
          if [ -d "plugin/data/locale" ]; then
            cp -r plugin/data/locale package/data/obs-plugins/${{ env.PLUGIN_NAME }}/
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ github.sha }}-ubuntu-x86_64
          path: ${{ github.workspace }}/package/*
