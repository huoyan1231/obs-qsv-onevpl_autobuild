name: Build obs-qsv-onevpl

on:
  push:
    branches: [main, master, NEW]
    tags: ['v*']
  pull_request:
    branches: [main, master, NEW]
  workflow_dispatch:

env:
  PLUGIN_NAME: obs-qsv-onevpl
  OBS_VERSION: 32.0.4

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout OBS Studio
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_VERSION }}
          path: obs-studio
          fetch-depth: 1
          submodules: recursive

      - name: Checkout Plugin
        uses: actions/checkout@v4
        with:
          path: obs-studio/plugins/${{ env.PLUGIN_NAME }}

      - name: Setup oneVPL
        run: |
          git clone --depth 1 https://github.com/oneapi-src/oneVPL.git libvpl
        working-directory: ${{ github.workspace }}/obs-studio/plugins/${{ env.PLUGIN_NAME }}

      - name: Setup Intel Media SDK Headers
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Intel-Media-SDK/MediaSDK.git
          cd MediaSDK
          git sparse-checkout set api/include
        working-directory: ${{ github.workspace }}/obs-studio/plugins/${{ env.PLUGIN_NAME }}

      - name: Add Plugin to OBS CMake
        run: |
          "add_subdirectory(${{ env.PLUGIN_NAME }})" | Out-File -FilePath plugins/CMakeLists.txt -Encoding utf8 -Append
        working-directory: ${{ github.workspace }}/obs-studio

      - name: Configure CMake
        run: cmake --preset windows-x64 -DMEDIASDK_INCLUDE_DIR="${{ github.workspace }}/obs-studio/plugins/${{ env.PLUGIN_NAME }}/MediaSDK/api/include"
        working-directory: ${{ github.workspace }}/obs-studio

      - name: Build
        run: cmake --build --preset windows-x64 --config RelWithDebInfo
        working-directory: ${{ github.workspace }}/obs-studio

      - name: Package Plugin
        run: |
          $PackageDir = "${{ github.workspace }}/package"
          $BuildDir = "${{ github.workspace }}/obs-studio/build_x64/plugins/${{ env.PLUGIN_NAME }}/obs-qsvonevpl/RelWithDebInfo"
          New-Item -ItemType Directory -Path "$PackageDir/obs-plugins/64bit" -Force
          New-Item -ItemType Directory -Path "$PackageDir/data/obs-plugins/${{ env.PLUGIN_NAME }}" -Force
          Copy-Item "$BuildDir/obs-qsvonevpl.dll" "$PackageDir/obs-plugins/64bit/"
          Copy-Item "$BuildDir/obs-qsvonevpl.pdb" "$PackageDir/obs-plugins/64bit/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ github.sha }}-windows-x64
          path: ${{ github.workspace }}/package/*

  linux:
    name: Ubuntu (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Install Dependencies
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y \
            obs-studio \
            libvpl-dev \
            libsimde-dev \
            libx11-dev \
            cmake \
            ninja-build \
            pkg-config \
            build-essential \
            libva-dev \
            libwayland-dev \
            libdrm-dev

      - name: Configure CMake
        run: |
          cmake -S plugin -B build_x64 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_HEVC=ON

      - name: Build
        run: cmake --build build_x64

      - name: Package Plugin
        run: |
          mkdir -p package/obs-plugins/64bit
          mkdir -p package/data/obs-plugins/${{ env.PLUGIN_NAME }}
          cp build_x64/obs-qsvonevpl/obs-qsvonevpl.so package/obs-plugins/64bit/
          if [ -d "plugin/data/locale" ]; then
            cp -r plugin/data/locale package/data/obs-plugins/${{ env.PLUGIN_NAME }}/
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ github.sha }}-ubuntu-x86_64
          path: ${{ github.workspace }}/package/*
