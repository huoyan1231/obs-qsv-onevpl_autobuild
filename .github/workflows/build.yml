name: Build obs-qsv-onevpl

on:
  push:
    branches: [main, master, NEW]
    tags: ['v*']
  pull_request:
    branches: [main, master, NEW]
  workflow_dispatch:

env:
  PLUGIN_NAME: obs-qsv-onevpl
  OBS_VERSION: 32.0.4

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Cache OBS Studio Source
        id: cache-obs
        uses: actions/cache@v4
        with:
          path: obs-studio
          key: obs-studio-${{ env.OBS_VERSION }}-${{ runner.os }}

      - name: Checkout OBS Studio
        if: steps.cache-obs.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_VERSION }}
          path: obs-studio
          fetch-depth: 1
          submodules: recursive

      - name: Checkout Plugin
        uses: actions/checkout@v4
        with:
          path: obs-studio/plugins/${{ env.PLUGIN_NAME }}

      - name: Cache oneVPL
        id: cache-onevpl
        uses: actions/cache@v4
        with:
          path: obs-studio/plugins/${{ env.PLUGIN_NAME }}/libvpl
          key: onevpl-${{ runner.os }}

      - name: Setup oneVPL
        if: steps.cache-onevpl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/oneapi-src/oneVPL.git libvpl
        working-directory: ${{ github.workspace }}/obs-studio/plugins/${{ env.PLUGIN_NAME }}

      - name: Cache Intel Media SDK Headers
        id: cache-mediasdk
        uses: actions/cache@v4
        with:
          path: obs-studio/plugins/${{ env.PLUGIN_NAME }}/MediaSDK
          key: mediasdk-${{ runner.os }}

      - name: Setup Intel Media SDK Headers
        if: steps.cache-mediasdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Intel-Media-SDK/MediaSDK.git
          cd MediaSDK
          git sparse-checkout set api/include
        working-directory: ${{ github.workspace }}/obs-studio/plugins/${{ env.PLUGIN_NAME }}

      - name: Add Plugin to OBS CMake
        run: |
          $cmakeFile = "plugins/CMakeLists.txt"
          $line = "add_subdirectory(${{ env.PLUGIN_NAME }})"
          if (-not (Select-String -Path $cmakeFile -Pattern $line -SimpleMatch -Quiet)) {
            $line | Out-File -FilePath $cmakeFile -Encoding utf8 -Append
          }
        working-directory: ${{ github.workspace }}/obs-studio

      - name: Configure CMake
        run: cmake --preset windows-x64 -DMEDIASDK_INCLUDE_DIR="${{ github.workspace }}/obs-studio/plugins/${{ env.PLUGIN_NAME }}/MediaSDK/api/include"
        working-directory: ${{ github.workspace }}/obs-studio

      - name: Build (plugin only)
        run: cmake --build --preset windows-x64 --config RelWithDebInfo --target obs-qsvonevpl
        working-directory: ${{ github.workspace }}/obs-studio

      - name: Package Plugin
        run: |
          $PackageDir = "${{ github.workspace }}/package"
          $BuildDir = "${{ github.workspace }}/obs-studio/build_x64/plugins/${{ env.PLUGIN_NAME }}/obs-qsvonevpl/RelWithDebInfo"
          New-Item -ItemType Directory -Path "$PackageDir/obs-plugins/64bit" -Force
          New-Item -ItemType Directory -Path "$PackageDir/data/obs-plugins/${{ env.PLUGIN_NAME }}" -Force
          Copy-Item "$BuildDir/obs-qsvonevpl.dll" "$PackageDir/obs-plugins/64bit/"
          Copy-Item "$BuildDir/obs-qsvonevpl.pdb" "$PackageDir/obs-plugins/64bit/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ github.sha }}-windows-x64
          path: ${{ github.workspace }}/package/*
